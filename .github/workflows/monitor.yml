name: Kick Campaign Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run checker
        run: python check_kick.py

      - name: Commit seen file
        run: |
          git config user.name "kick-bot"
          git config user.email "kick-bot@users.noreply.github.com"
          git add seen_campaigns.json || true
          git diff --staged --quiet || git commit -m "update seen"
          git push || true
